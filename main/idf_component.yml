# arduino-esp32 + ArduinoJson 通过 ESP Component Registry 自动拉取。
#
# ⚠️ 版本必须和已装的 ESP-IDF 严格匹配,否则一定编译失败:
#     ESP-IDF v5.5.x -> arduino-esp32 "3.3.x"(推荐 3.3.10)
#     ESP-IDF v5.4.x -> "3.2.0"
#     ESP-IDF v5.3.x -> "3.1.0"
#     ESP-IDF v5.1.x -> "3.0.5"
# 查 IDF 版本: idf.py --version
dependencies:
  espressif/arduino-esp32:
    version: "3.3.10"  # ← 按上表改成和你 IDF 版本对应的那一行
  bblanchon/ArduinoJson:
    version: "^6.21.0"  # 与 LiClock(v6.18.3)对齐,DynamicJsonDocument 可用;阶段1 起 HAL 用
